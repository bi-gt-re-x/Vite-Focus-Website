  ═══════════════════════════════════════════════════════════════════
  SHARED SHELL REFERENCE
  This file is not a page — it is the markup every mockup repeats.
  Port it once into src/components/layout/AppShell.jsx + Sidebar.jsx
  + Topbar.jsx, then each page only renders what goes inside .content.

  stroke-linecap -> strokeLinecap, for -> htmlFor.

-->
