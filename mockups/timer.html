<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timer · FocusDeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../src/styles/reset.css" />
<link rel="stylesheet" href="../src/styles/tokens.css" />
<link rel="stylesheet" href="../src/styles/global.css" />
<link rel="stylesheet" href="../src/styles/layout.css" />
<link rel="stylesheet" href="../src/styles/components.css" />
<link rel="stylesheet" href="../src/styles/pages/timer.css" />
</head>
<body>
<div class="app" data-collapsed="false">
  <aside class="sidebar">
    <div class="sidebar__brand"><div class="sidebar__logo">FD</div><span>FocusDeck</span></div>
    <nav class="sidebar__nav">
      <a class="nav-link" href="home.html" data-page="home"><svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a class="nav-link nav-link--active" href="timer.html" data-page="timer"><svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg><span>Timer</span></a>
      <a class="nav-link" href="decks.html" data-page="decks"><svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg><span>Decks</span><span class="nav-link__badge">6</span></a>
      <a class="nav-link" href="study.html" data-page="study"><svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></svg><span>Study</span></a>
      <a class="nav-link" href="stats.html" data-page="stats"><svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Stats</span></a>
      <a class="nav-link" href="settings.html" data-page="settings"><svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span></a>
    </nav>
    <div class="sidebar__footer">
      <div class="sidebar__streak"><span>🔥</span><div><strong>7</strong> <span class="faint">day streak</span></div></div>
    </div>
  </aside>
  <div class="app__main">
    <header class="topbar">
      <h1 class="topbar__title">Timer</h1>
      <div class="topbar__actions">
        <div class="topbar__mini-timer" data-running="true"><span class="topbar__mini-dot"></span><span>18:42</span></div>
        <button class="btn btn--ghost btn--icon tooltip" data-tip="Toggle theme" aria-label="Toggle theme">🌙</button>
      </div>
    </header>
    <main class="content content--focus timer-page" data-mode="focus">
      <!-- data-mode on this container re-points --accent at the phase colour.
           Set it to "focus" | "short" | "long" from React. -->

      <div class="mode-switch" role="tablist" aria-label="Timer mode">
        <button class="mode-switch__btn mode-switch__btn--active" role="tab" aria-selected="true">Focus</button>
        <button class="mode-switch__btn" role="tab" aria-selected="false">Short break</button>
        <button class="mode-switch__btn" role="tab" aria-selected="false">Long break</button>
      </div>

      <div class="timer-task">
        <span>📌</span>
        <input class="timer-task__input" placeholder="What are you working on?" value="Finish the study page" />
      </div>

      <!-- Dial.
           r = 46 in a 0 0 100 100 viewBox  ->  circumference = 2πr ≈ 289.03
           strokeDasharray  = 289.03
           strokeDashoffset = 289.03 * (1 - secondsLeft / totalSeconds)      -->
      <div class="dial" data-running="true">
        <svg class="dial__svg" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="dial__track" cx="50" cy="50" r="46" />
          <circle class="dial__progress" cx="50" cy="50" r="46"
                  stroke-dasharray="289.03" stroke-dashoffset="86.7" />
        </svg>
        <div class="dial__glow"></div>
        <div class="dial__inner">
          <span class="dial__time" role="timer" aria-live="off">18:42</span>
          <span class="dial__label">Focus</span>
          <span class="dial__round">Round 2 of 4</span>
        </div>
      </div>

      <div class="round-track" aria-label="Rounds completed">
        <span class="round-dot round-dot--done"></span>
        <span class="round-dot round-dot--current"></span>
        <span class="round-dot"></span>
        <span class="round-dot"></span>
      </div>

      <div class="timer-controls">
        <button class="timer-controls__side tooltip" data-tip="Reset" aria-label="Reset timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button class="timer-controls__main" aria-label="Pause timer">
          <!-- swap for the play triangle when paused: <path d="M8 5v14l11-7z"/> -->
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="4" height="14" rx="1"/><rect x="13" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button class="timer-controls__side tooltip" data-tip="Skip" aria-label="Skip to next phase">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/></svg>
        </button>
      </div>

      <div class="session-strip">
        <div>
          <div class="session-strip__value">2</div>
          <div class="session-strip__label">Rounds done</div>
        </div>
        <div>
          <div class="session-strip__value">50m</div>
          <div class="session-strip__label">Focused today</div>
        </div>
        <div>
          <div class="session-strip__value">16:05</div>
          <div class="session-strip__label">Finish at</div>
        </div>
      </div>

      <p class="keyboard-hints">
        <span><span class="kbd">Space</span> start / pause</span>
        <span><span class="kbd">R</span> reset</span>
        <span><span class="kbd">S</span> skip</span>
        <span><span class="kbd">F</span> zen mode</span>
      </p>
    </main>
  </div>
</div>
</body>
</html>
